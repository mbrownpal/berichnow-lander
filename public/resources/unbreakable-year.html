document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

d){visibility:hidden}\nbody{margin:0}\na{color:#B87333;text-decoration:none}\na:hover{color:#C4956A}\n<\u002Fstyle>\n<script src=\"fd50c048-1726-4c56-99b4-249c6a80e405\"><\u002Fscript>\n<\u002Fhelmet>\n<doc-page size=\"letter\">\n\n<section class=\"page\" data-screen-label=\"01 Cover\" style=\"position:relative;padding:1.1in 1in 0.85in;background:#14120F;color:#C4BDB2;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden\">\n  <div style=\"position:absolute;inset:0.34in;border:1px solid rgba(184,115,51,.28);pointer-events:none\"><\u002Fdiv>\n  <div style=\"text-align:center;position:relative\">\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:4.5px;text-transform:uppercase;color:#B87333;margin:0\">Unbreakable Wealth<\u002Fp>\n    <h1 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:66px;line-height:1.06;color:#EDE5D8;margin:34px 0 0;letter-spacing:-0.5px\">The Unbreakable<br><em style=\"font-style:italic\">Year<\u002Fem><\u002Fh1>\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:5px;text-transform:uppercase;color:#8A8375;margin:30px 0 0\">Annual Planning Guide<\u002Fp>\n    <div style=\"width:44px;height:1px;background:#B87333;margin:38px auto\"><\u002Fdiv>\n    <p style=\"font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20.5px;line-height:1.66;color:#CDC6BB;max-width:4.4in;margin:0 auto\">Three exercises for designing the year you actually want, and pricing out what it costs to live it.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"position:relative\">\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#8A8375;margin:0 0 14px\">Contents<\u002Fp>\n    <div style=\"display:flex;align-items:baseline;gap:18px;padding:14px 0;border-top:1px solid rgba(184,115,51,.3)\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:2px;color:#B87333;min-width:26px\">I<\u002Fspan>\n      <span style=\"font-family:'Playfair Display',serif;font-size:21px;color:#EDE5D8\">Year in Review<\u002Fspan>\n      <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8A8375\">25 Questions<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:18px;padding:14px 0;border-top:1px solid rgba(184,115,51,.3)\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:2px;color:#B87333;min-width:26px\">II<\u002Fspan>\n      <span style=\"font-family:'Playfair Display',serif;font-size:21px;color:#EDE5D8\">The Unbreakable Year<\u002Fspan>\n      <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8A8375\">The Vision<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;align-items:baseline;gap:18px;padding:14px 0;border-top:1px solid rgba(184,115,51,.3);border-bottom:1px solid rgba(184,115,51,.3)\">\n      <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:2px;color:#B87333;min-width:26px\">III<\u002Fspan>\n      <span style=\"font-family:'Playfair Display',serif;font-size:21px;color:#EDE5D8\">The Magic Word<\u002Fspan>\n      <span style=\"margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:#8A8375\">The Intention<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"02 A note before you begin\" style=\"position:relative;padding:0.95in 1in 0.8in;background:#FBF9F5;color:#4A4438;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:40px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">A note before you begin<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">Mike Brown<\u002Fspan>\n  <\u002Fdiv>\n  <p style=\"font-size:20.5px;line-height:1.62;color:#221F1A;margin:0\">If you're reading this, you're on your way to an epic year. If there is one thing I've learned about designing your Rich Life, it's that intentionality is the key.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:22px 0 0\">I recommend blocking a few hours, with your partner if you have one, and giving yourself the time and space to dive in free of interruptions. It doesn't matter whether you do it all at once or break it up over several sittings. Each exercise builds on the ones before it.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:15px 0 0\">We'll start with the Year in Review, with 25 questions designed to highlight what went well, what didn't, and areas to focus your attention in the coming year.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:15px 0 0\">Next we'll dive into the Unbreakable Year, my signature exercise for designing your rich life. It will help you envision your ideal lifestyle, understand how much that life costs, and see what you can do to improve it for free.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:15px 0 0\">Finally, the Magic Word is my favorite. I've been using this personally, and with my community and team members, for the last five years. We all look forward to it every year. The power of a single-word intention has to be experienced to be believed.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:15px 0 0\">I hope this guide helps you author your version of a rich life. If you want more powerful exercises like this one, consider joining the Unbreakable Wealth community, where high performers, founders, athletes, and professionals focus on mastering money in order to find meaning, purpose and fulfillment.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:28px 0 0\">Here's to everything the next twelve months have to offer.<\u002Fp>\n  <p style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:26px;color:#221F1A;margin:10px 0 0\">mb<\u002Fp>\n  <div style=\"position:absolute;left:1in;right:1in;bottom:0.5in;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A79F8E\">\n    <span>The Unbreakable Year<\u002Fspan><span>02<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"03 Section One\" style=\"position:relative;padding:0.95in 1in;background:#14120F;color:#C4BDB2;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden\">\n  <p style=\"font-family:'Playfair Display',serif;font-size:210px;line-height:1;color:rgba(184,115,51,.13);margin:0;position:absolute;left:0;right:0;top:2.6in;pointer-events:none\">I<\u002Fp>\n  <div style=\"position:relative\">\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:5px;text-transform:uppercase;color:#B87333;margin:0 0 30px\">Section One<\u002Fp>\n    <h1 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:54px;line-height:1.1;color:#EDE5D8;margin:0\">Year in <em style=\"font-style:italic\">Review<\u002Fem><\u002Fh1>\n    <div style=\"width:44px;height:1px;background:#B87333;margin:36px auto\"><\u002Fdiv>\n    <p style=\"font-size:19.5px;line-height:1.68;color:#CDC6BB;max-width:4.4in;ma line\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#B87333;flex:0 0 auto;min-width:18px\">25<\u002Fspan><span style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">What habits served you well? Which ones didn't?<\u002Fspan><\u002Fdiv><sc-for list=\"{{ l3 }}\" as=\"x\" hint-placeholder-count=\"3\"><div style=\"height:1px;background:#DCD3C2;margin-top:31px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"position:absolute;left:1in;right:1in;bottom:0.5in;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A79F8E\"><span>The Unbreakable Year<\u002Fspan><span>08<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"09 Section Two\" style=\"position:relative;padding:0.95in 1in;background:#14120F;color:#C4BDB2;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden\">\n  <p style=\"font-family:'Playfair Display',serif;font-size:210px;line-height:1;color:rgba(184,115,51,.13);margin:0;position:absolute;left:0;right:0;top:2.6in;pointer-events:none\">II<\u002Fp>\n  <div style=\"position:relative\">\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:5px;text-transform:uppercase;color:#B87333;margin:0 0 30px\">Section Two<\u002Fp>\n    <h1 style=\"font-family:'Playfair Display',serif;font-weight:400;font-size:54px;line-height:1.1;color:#EDE5D8;margin:0\">The Unbreakable <em style=\"font-style:italic\">Year<\u002Fem><\u002Fh1>\n    <div style=\"width:44px;height:1px;background:#B87333;margin:36px auto\"><\u002Fdiv>\n    <p style=\"font-size:19.5px;line-height:1.68;color:#CDC6BB;max-width:4.4in;margin:0 auto\">My signature exercise for designing your rich life. Not only will this help you envision your ideal lifestyle, it will show you what that life costs and what you can do to improve it for free.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"10 Before you begin\" style=\"position:relative;padding:0.95in 1in 0.8in;background:#FBF9F5;color:#4A4438;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:48px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">II · The Unbreakable Year<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">Before you begin<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"text-align:center;max-width:4.6in;margin:0 auto 46px\">\n    <p style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:29px;line-height:1.42;color:#221F1A;margin:0\">“I am the source of time. Time is a resource I distribute. I am the producer of time.”<\u002Fp>\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:#B87333;margin:22px 0 0\">Gay Hendricks<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"height:1px;background:rgba(184,115,51,.22);margin-bottom:36px\"><\u002Fdiv>\n  <p style=\"font-size:20.5px;line-height:1.62;color:#221F1A;margin:0\">Take a moment before you begin. Let go of expectations, obligations, and shoulds. This exercise is about imagining a year that reflects the life you actually want to live, rather than the life your obligations drag you into.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:22px 0 0\">This workbook walks you through the full Unbreakable Year process that I've been using both personally and with members of my community since 2017.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:15px 0 0\">Here is where you give yourself permission to dream without restraint. No one is going to hold you to any specific detail. Instead, think of this as a guiding light, a bold vision to hold for what's possible.<\u002Fp>\n  <h3 style=\"font-family:'Playfair Display',serif;font-weight:600;font-size:22px;line-height:1.3;color:#221F1A;margin:34px 0 0\">To begin your vision, remember three things<\u002Fh3>\n  <ul style=\"margin:18px 0 0;padding:0;list-style:none\">\n    <li style=\"position:relative;padding-left:22px;font-size:18px;line-height:1.65;margin-bottom:9px\"><span style=\"position:absolute;left:0;top:13px;width:9px;height:1px;background:#B87333\"><\u002Fspan>Dare to dream bigger than what feels reasonable.<\u002Fli>\n    <li style=\"position:relative;padding-left:22px;font-size:18px;line-height:1.65;margin-bottom:9px\"><span style=\"position:absolute;left:0;top:13px;width:9px;height:1px;background:#B87333\"><\u002Fspan>Start with your big rocks so the small things fall into place naturally.<\u002Fli>\n    <li style=\"position:relative;padding-left:22px;font-size:16.5px;line-height:1.7\"><span style=\"position:absolute;left:0;top:13px;width:9px;height:1px;background:#B87333\"><\u002Fspan>Let yourself imagine a life where you do not apologize for what you want.<\u002Fli>\n  <\u002Ful>\n  <div style=\"position:absolute;left:1in;right:1in;bottom:0.5in;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A79F8E\"><span>The Unbreakable Year<\u002Fspan><span>10<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"11 Five Pillars\" style=\"position:relative;padding:0.95in 1in 0.8in;background:#FBF9F5;color:#4A4438;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">II · The Unbreakable Year<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">The Five Pillars of Freedom<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:2.8px;text-transform:uppercase;color:#B87333;padding-bottom:9px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:17px\">The Five Pillars of Freedom<\u002Fdiv>\n  <p style=\"font-size:18px;line-height:1.7;margin:0 0 24px\">Your life rests on five foundational domains. These are the areas where freedom compounds and where constraints show you where to focus. Define what wealth means to you in each one.<\u002Fp>\n  <div style=\"margin-bottom:17px\"><div style=\"font-family:'Playfair Display',serif;font-size:22px;font-weight:500;color:#221F1A\">Health<\u002Fdiv><div style=\"font-size:16px;color:#7C7566;font-style:italic;margin-top:3px\">Your body, your energy, your capacity to be here for it.<\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:28px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:17px\"><div style=\"font-family:'Playfair Display',serif;font-size:22px;font-weight:500;color:#221F1A\">Relationships<\u002Fdiv><div style=\"font-size:16px;color:#7C7566;font-style:italic;margin-top:3px\">The people you build a life around.<\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:28px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:17px\"><div style=\"font-family:'Playfair Display',serif;font-size:22px;font-weight:500;color:#221F1A\">Time<\u002Fdiv><div style=\"font-size:16px;color:#7C7566;font-style:italic;margin-top:3px\">What you own, what you owe, and what you protect.<\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:28px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:17px\"><div style=\"font-family:'Playfair Display',serif;font-size:22px;font-weight:500;color:#221F1A\">Mind<\u002Fdiv><div style=\"font-size:16px;color:#7C7566;font-style:italic;margin-top:3px\">What you learn, what you build, what you think about.<\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:28px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div><div style=\"font-family:'Playfair Display',serif;font-size:22px;font-weight:500;color:#221F1A\">Soul<\u002Fdiv><div style=\"font-size:16px;color:#7C7566;font-style:italic;margin-top:3px\">What it is all in service of.<\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:28px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"position:absolute;left:1in;right:1in;bottom:0.5in;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A79F8E\"><span>The Unbreakable Year<\u002Fspan><span>11<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"12 Lifestyle\" style=\"position:relative;padding:0.95in 1in 0.8in;background:#FBF9F5;color:#4A4438;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text \n  <p style=\"font-size:20.5px;line-height:1.62;color:#221F1A;margin:0\">This exercise is both one of my favorites and one of the most powerful annual traditions I've used over the past few years to set intentions and guide my decision-making for the coming year.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:22px 0 0\">A word of wisdom after doing this for a few years. Once you've gone through the exercise, sit with your word for a week or so and make sure it still brings the same magic. Think of it like trying on a new shirt. It may feel great initially, and you want to know whether you still like it after wearing it a couple of times.<\u002Fp>\n  <div style=\"height:1px;background:rgba(184,115,51,.22);margin:36px 0 32px\"><\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:2.8px;text-transform:uppercase;color:#B87333;padding-bottom:9px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:22px\">Part One · Reflection<\u002Fdiv>\n  <p style=\"font-size:18px;line-height:1.7;margin:0 0 26px\">Take out your journal and reflect on these questions. This part may be a bit uncomfortable, and that's ok. Lean in with curiosity. It gets better.<\u002Fp>\n  <div style=\"margin-bottom:26px\"><div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#B87333;flex:0 0 auto;min-width:18px\">01<\u002Fspan><span style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">What patterns kept showing up for you last year? Where did you feel stuck or notice yourself repeating the same challenges?<\u002Fspan><\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:34px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div><div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#B87333;flex:0 0 auto;min-width:18px\">02<\u002Fspan><span style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">When did you feel most alive and aligned last year? What were you doing? Who were you being in those moments?<\u002Fspan><\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:34px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"position:absolute;left:1in;right:1in;bottom:0.5in;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A79F8E\"><span>The Unbreakable Year<\u002Fspan><span>27<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"28 Part One continued\" style=\"position:relative;padding:0.95in 1in 0.8in;background:#FBF9F5;color:#4A4438;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">III · The Magic Word<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">Part One, continued<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:2.8px;text-transform:uppercase;color:#B87333;padding-bottom:9px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:28px\">Part One · Reflection<\u002Fdiv>\n  <div style=\"margin-bottom:28px\"><div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#B87333; 8;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">III · The Magic Word<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">Part Two<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:2.8px;text-transform:uppercase;color:#B87333;padding-bottom:9px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:24px\">Part Two · Vision<\u002Fdiv>\n  <p style=\"font-size:18px;line-height:1.7;margin:0 0 30px\">Imagine yourself on December 31st of this year, reflecting back on the most transformative year of your life. Write down everything you see, feel and experience in this vision without editing or judging.<\u002Fp>\n  <div style=\"margin-bottom:28px\"><div style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">How do you feel in your body?<\u002Fdiv><sc-for list=\"{{ l3 }}\" as=\"x\" hint-placeholder-count=\"3\"><div style=\"height:1px;background:#DCD3C2;margin-top:34px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:28px\"><div style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">What's different about how you show up in your relationships?<\u002Fdiv><sc-for list=\"{{ l3 }}\" as=\"x\" hint-placeholder-count=\"3\"><div style=\"height:1px;background:#DCD3C2;margin-top:34px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:28px\"><div style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">How has your relationship with your work evolved?<\u002Fdiv><sc-for list=\"{{ l3 }}\" as=\"x\" hint-placeholder-count=\"3\"><div style=\"height:1px;background:#DCD3C2;margin-top:34px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div><div style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">What makes you most proud about who you've become?<\u002Fdiv><sc-for list=\"{{ l3 }}\" as=\"x\" hint-placeholder-count=\"3\"><div style=\"height:1px;background:#DCD3C2;margin-top:34px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"position:absolute;left:1in;right:1in;bottom:0.5in;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A79F8E\"><span>The Unbreakable Year<\u002Fspan><span>29<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"30 Part Three\" style=\"position:relative;padding:0.95in 1in 0.8in;background:#FBF9F5;color:#4A4438;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">III · The Magic Word<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">Part Three<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:2.8px;text-transform:uppercase;color:#B87333;padding-bottom:9px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:24px\">Part Three · The List<\u002Fdiv>\n  <p style=\"font-size:18px;line-height:1.7;margin:0\">Look at what you've written so far. Start circling words or themes that stand out. What patterns do you notice?<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:15px 0 0\">Make a list of five to ten potential words, or more, that capture the essence of who you want to become, how you want to feel, and what you want to create.<\u002Fp>\n  <p style=\"font-size:18px;line-height:1.7;margin:15px 0 0\">Don't be too focused on finding the perfect word. It's more about listing everything that comes to mind, and we will pare it down later. Remember that your word isn't about what you want to do or achieve. It's about who you want to be.<\u002Fp>\n  <div style=\"height:1px;background:rgba(184,115,51,.22);margin:32px 0 6px\"><\u002Fdiv>\n  <sc-for list=\"{{ l14 }}\" as=\"x\" hint-placeholder-count=\"14\"><div style=\"height:1px;background:#DCD3C2;margin-top:34px\"><\u002Fdiv><\u002Fsc-for>\n  <div style=\"position:absolute;left:1in;right:1in;bottom:0.5in;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A79F8E\"><span>The Unbreakable Year<\u002Fspan><span>30<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"31 Part Four\" style=\"position:relative;padding:0.95in 1in 0.8in;background:#FBF9F5;color:#4A4438;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">III · The Magic Word<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">Part Four<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:2.8px;text-transform:uppercase;color:#B87333;padding-bottom:9px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:20px\">Part Four · Testing your word<\u002Fdiv>\n  <p style=\"font-size:18px;line-height:1.7;margin:0 0 24px\">Once you have your shortlist, circle your top three and test each one with these questions.<\u002Fp>\n  <div style=\"margin-bottom:24px\"><div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#B87333;flex:0 0 auto;min-width:18px\">01<\u002Fspan><span style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">Does this word make you feel both excited and slightly uncomfortable? Growth happens at the edge of your comfort zone.<\u002Fspan><\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:32px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:24px\"><div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#B87333;flex:0 0 auto;min-width:18px\">02<\u002Fspan><span style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">Is this word broad enough to apply to all areas of your life, yet specific enough to guide daily decisions?<\u002Fspan><\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:32px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:24px\"><div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#B87333;flex:0 0 auto;min-width:18px\">03<\u002Fspan><span style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">When you say this word out loud, does it feel true? Does it resonate in your body?<\u002Fspan><\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:32px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:24px\"><div style=\"display:flex;gap:12px;align-items:baseline\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;color:#B87333;flex:0 0 auto;min-width:18px\">04<\u002Fspan><span style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">Can you imagine using this word as a filter for decisions throughout the year?<\u002Fspan><\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:32px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"height:1px;background:rgba(184,115,51,.22);margin:0 0 22px\"><\u002Fdiv>\n  <p style=\"font-size:16.5px;line-height:1.65;color:#7C7566;font-style:italic;margin:0\">Do your best to focus on the words that roll up and embody others on the list. For example, my word one year was Purpose. When I looked at the other words on my list, such as Productive or Intentional, they were all included within the bigger idea of Purpose.<\u002Fp>\n  <div style=\"position:absolute;left:1in;right:1in;bottom:0.5in;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A79F8E\"><span>The Unbreakable Year<\u002Fspan><span>31<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"32 Part Five\" style=\"position:relative;padding:0.95in 1in 0.8in;background:#FBF9F5;color:#4A4438;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;overflow:hidden\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:36px\">\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">III · The Magic Word<\u002Fspan>\n    <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:#7C7566\">Part Five<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:500;letter-spacing:2.8px;text-transform:uppercase;color:#B87333;padding-bottom:9px;border-bottom:1px solid rgba(184,115,51,.25);margin-bottom:24px\">Part Five · Commitment<\u002Fdiv>\n  <p style=\"font-size:18px;line-height:1.7;margin:0 0 30px\">Choose your word and write it down. Then complete these statements.<\u002Fp>\n  <div style=\"border:1px solid rgba(184,115,51,.35);padding:30px 32px 26px;margin-bottom:34px;text-align:center\">\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:#B87333;margin:0 0 26px\">My word<\u002Fp>\n    <div style=\"height:1px;background:#C9C1B0\"><\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-bottom:26px\"><div style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">I choose this word because…<\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:32px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:26px\"><div style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">This word will help me become…<\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:32px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"margin-bottom:26px\"><div style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">I will know I'm living this word when…<\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:32px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div><div style=\"font-size:18px;line-height:1.5;font-weight:600;color:#221F1A\">When I'm challenged, this word will remind me to…<\u002Fdiv><sc-for list=\"{{ l2 }}\" as=\"x\" hint-placeholder-count=\"2\"><div style=\"height:1px;background:#DCD3C2;margin-top:32px\"><\u002Fdiv><\u002Fsc-for><\u002Fdiv>\n  <div style=\"position:absolute;left:1in;right:1in;bottom:0.5in;display:flex;justify-content:space-between;font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#A79F8E\"><span>The Unbreakable Year<\u002Fspan><span>32<\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"page\" data-screen-label=\"33 Closing\" style=\"position:relative;padding:1in;background:#14120F;color:#C4BDB2;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;display:flex;flex-direction:column;justify-content:center;text-align:center;overflow:hidden\">\n  <div style=\"position:absolute;inset:0.34in;border:1px solid rgba(184,115,51,.28);pointer-events:none\"><\u002Fdiv>\n  <div style=\"position:relative\">\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:500;letter-spacing:4.5px;text-transform:uppercase;color:#B87333;margin:0\">One last thing<\u002Fp>\n    <div style=\"width:44px;height:1px;background:#B87333;margin:30px auto 36px\"><\u002Fdiv>\n    <p style=\"font-size:20.5px;line-height:1.64;color:#EDE5D8;max-width:4.5in;margin:0 auto\">There is no perfect word. What matters is choosing one that feels aligned with who you're becoming, and committing to let it guide you.<\u002Fp>\n    <p style=\"font-size:18px;line-height:1.7;max-width:4.5in;margin:22px auto 0\">Your word is your anchor for the year ahead. Let it be both your challenge and your permission slip, pushing you to grow while reminding you that you're exactly where you need to be on your journey.<\u002Fp>\n    <p style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:23px;color:#EDE5D8;margin:36px 0 0\">To finding your word,<\u002Fp>\n    <p style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:23px;color:#EDE5D8;margin:4px 0 0\">mb<\u002Fp>\n    <div style=\"height:1px;background:rgba(184,115,51,.3);margin:46px auto;width:2.6in\"><\u002Fdiv>\n    <p style=\"font-size:18px;line-height:1.7;max-width:4.2in;margin:0 auto\">Some people finish these exercises and want to go further with a room of people doing the same work.<\u002Fp>\n    <div style=\"margin-top:34px\"><a href=\"https://unbreakablewealth.com/application/\" style=\"display:inline-block;padding:16px 44px;background:#B87333;color:#14120F;font-family:'JetBrains Mono',monospace;font-size:11.5px;font-weight:500;letter-spacing:3px;text-transform:uppercase;text-decoration:none\">Apply to the community<\u002Fa><\u002Fdiv>\n    <p style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#8A8375;margin:20px 0 0\">unbreakablewealth.com · berichnow.com<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdoc-page>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const n = (k) => Array.from({length: k}, (_, i) => i);\n    return { l2: n(2), l3: n(3), l4: n(4), l5: n(5), l7: n(7), l14: n(14), l24: n(24) };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
